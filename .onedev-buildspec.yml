version: 6

jobs:
  - name: Build & Deploy MojoLlama Site
    steps:
      - type: CheckoutStep
        name: checkout
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false

      - type: CommandStep
        name: build C kernel + install deps
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |
            set -e
            set -o pipefail

            echo "=== System Dependencies ==="
            apt-get update -qq && apt-get install -y -qq gcc 2>/dev/null
            echo "System deps ready"

            echo "=== Python Dependencies ==="
            pip install flask numpy gguf regex ftfy --break-system-packages -q
            echo "Python deps ready"

            echo "=== Build C AVX2 Kernels ==="
            # Legacy C Q4_0 kernel
            gcc -O3 -march=native -shared -fPIC \
              -o src/mojollama/model/libq4matmul.so \
              src/mojollama/model/q4_matmul_c.c

            # New AVX2 reference kernel (hand-tuned intrinsics)
            gcc -O3 -mavx2 -mfma -mf16c -shared -fPIC \
              -o src/mojollama/kernels/q4_kernel_avx2.so \
              src/mojollama/kernels/q4_kernel_avx2.c
            echo "C AVX2 kernel built"

            # OpenMP parallel kernel (AVX2 + FMA + F16C + OpenMP)
            gcc -O3 -mavx2 -mfma -mf16c -fopenmp -shared -fPIC \
              -o src/mojollama/kernels/q4_kernel_omp.so \
              src/mojollama/kernels/q4_kernel_omp.c 2>/dev/null || \
            echo "OMP kernel skipped (no OpenMP support in container)"
            echo "C kernel build complete"

      - type: CommandStep
        name: verify model + smoke test
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |
            set -e
            set -o pipefail

            echo "=== Python Dependencies (fresh container) ==="
            pip install flask numpy gguf regex ftfy --break-system-packages -q

            export PYTHONPATH=/onedev-build/work/src:$PYTHONPATH

            echo "=== Model Check ==="
            if [ -f Llama-3.2-1B-Instruct-Q4_0.gguf ]; then
              echo "Model file present ($(du -h Llama-3.2-1B-Instruct-Q4_0.gguf | cut -f1))"
            else
              echo "Downloading model (728 MB)..."
              curl -L -o Llama-3.2-1B-Instruct-Q4_0.gguf \
                "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_0.gguf"
            fi

            echo ""
            echo "=== Start API Server (background) ==="
            cd /onedev-build/work

            nohup python3 -m mojollama.server \
              --model Llama-3.2-1B-Instruct-Q4_0.gguf \
              --port 8080 \
              > /tmp/mojollama-api.log 2>&1 &
            API_PID=$!
            echo "API server PID=$API_PID on port 8080"

            echo ""
            echo "=== Wait for Model Load + Health Check ==="
            for i in $(seq 1 60); do
              if curl -sf http://localhost:8080/v1/models > /dev/null 2>&1; then
                echo "API ready after ~${i}s"
                break
              fi
              if [ $i -eq 60 ]; then
                echo "API failed to start within 120s"
                cat /tmp/mojollama-api.log | tail -20
                kill $API_PID 2>/dev/null || true
                exit 1
              fi
              sleep 2
            done

            echo ""
            echo "=== Smoke Test: Chat Completion ==="
            RESULT=$(curl -sf -X POST http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{"messages":[{"role":"user","content":"Say hello in 3 words"}], "max_tokens":10}')
            echo "Response: $(echo "$RESULT" | head -c 200)"
            echo ""
            if echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['choices'][0]['message']['content']" 2>/dev/null; then
              echo "Smoke test passed"
            else
              echo "Smoke test failed"
              kill $API_PID 2>/dev/null || true
              exit 1
            fi

            echo ""
            echo "=== Smoke Test: List Models ==="
            curl -sf http://localhost:8080/v1/models | python3 -m json.tool | head -10

            echo ""
            echo "=========================================="
            echo "  MojoLlama Build + Smoke Test PASSED"
            echo "=========================================="

            kill $API_PID 2>/dev/null || true

      - type: PublishSiteStep
        name: deploy API web page to ~site
        condition: SUCCESSFUL
        optional: false
        artifacts: 'www/**'

    triggers:
      - type: BranchUpdateTrigger
        branches: main

    retryCondition: never
