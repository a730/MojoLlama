<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoLlama Studio — Console Log</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
  background: var(--bg); color: var(--text); font-size: 12px;
  height: 100vh; display: flex; flex-direction: column;
  overflow: hidden;
}
.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.toolbar-title {
  font-size: 12px; font-weight: 600; color: var(--accent);
  margin-right: auto; font-family: -apple-system, sans-serif;
}
.status-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 3px 8px;
  border-radius: 4px; background: var(--bg);
  font-family: -apple-system, sans-serif;
}
.badge-dot {
  width: 6px; height: 6px; border-radius: 50%; display: inline-block;
}
.badge-dot.running { background: var(--green); }
.badge-dot.stopped { background: var(--dim); }
.badge-dot.starting,
.badge-dot.stopping { background: var(--yellow); animation: pulse 1s infinite; }
.badge-dot.error { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.search-box {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px;
}
.search-box input {
  background: transparent; border: none; color: var(--text);
  font-size: 11px; outline: none; width: 160px;
  font-family: 'SF Mono', monospace;
}
.search-box input::placeholder { color: var(--dim); }

.btn {
  padding: 4px 10px; border: none; border-radius: 4px;
  cursor: pointer; font-size: 11px; font-weight: 500;
  transition: all .2s; font-family: -apple-system, sans-serif;
}
.btn:hover { filter: brightness(1.15); }
.btn-dim { background: var(--border); color: var(--text); }
.btn-red { background: var(--red); color: #fff; }

.log-container {
  flex: 1; overflow-y: auto; padding: 4px 0;
  scroll-behavior: smooth;
}
.log-container::-webkit-scrollbar { width: 6px; }
.log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.log-container::-webkit-scrollbar-track { background: transparent; }

.log-entry {
  padding: 2px 12px; line-height: 1.5;
  border-bottom: 1px solid rgba(48, 54, 61, 0.3);
  white-space: pre-wrap; word-break: break-all;
  transition: background .15s;
}
.log-entry:hover { background: rgba(88,166,255,0.05); }

.log-entry .timestamp {
  color: var(--dim); margin-right: 8px;
  -webkit-user-select: none; user-select: none;
}
.log-entry .level-tag {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 0 4px; border-radius: 2px; margin-right: 6px;
  text-transform: uppercase; min-width: 36px; text-align: center;
}
.level-info .level-tag { color: var(--accent); background: rgba(88,166,255,0.1); }
.level-warn .level-tag { color: var(--yellow); background: rgba(210,153,34,0.1); }
.level-error .level-tag { color: var(--red); background: rgba(248,81,73,0.1); }
.level-debug .level-tag { color: var(--dim); background: rgba(139,148,158,0.1); }

.log-entry .message { color: var(--text); }

.filter-bar {
  display: flex; gap: 4px; padding: 4px 12px;
  background: var(--surface); border-top: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap;
}
.filter-btn {
  padding: 2px 8px; border: 1px solid var(--border);
  border-radius: 3px; background: transparent; color: var(--dim);
  cursor: pointer; font-size: 10px; font-weight: 500;
  transition: all .15s; font-family: -apple-system, sans-serif;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-count { font-size: 10px; color: var(--dim); margin-left: auto; }

.empty-state {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--dim); font-size: 13px;
  font-family: -apple-system, sans-serif;
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">📋 Console Log</span>
  <div class="status-badge">
    <span class="badge-dot stopped" id="statusDot"></span>
    <span id="statusLabel">Server: checking...</span>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Filter log..." oninput="applyFilter()">
  </div>
  <button class="btn btn-dim" onclick="clearLog()">Clear</button>
</div>

<div class="log-container" id="logContainer">
  <div class="empty-state">Waiting for server output...</div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-level="all" onclick="toggleFilter(this, 'all')">All</button>
  <button class="filter-btn active" data-level="info" onclick="toggleFilter(this, 'info')">Info</button>
  <button class="filter-btn active" data-level="warn" onclick="toggleFilter(this, 'warn')">Warn</button>
  <button class="filter-btn active" data-level="error" onclick="toggleFilter(this, 'error')">Error</button>
  <button class="filter-btn active" data-level="debug" onclick="toggleFilter(this, 'debug')">Debug</button>
  <span class="filter-count" id="entryCount">0 entries</span>
  <span style="font-size:10px;color:var(--dim)" id="autoScrollLabel">▼ Auto-scroll</span>
</div>

<script src="log.js"></script>
</body>
</html>
