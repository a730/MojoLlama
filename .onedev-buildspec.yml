version: 6

jobs:
  - name: Build & Deploy MojoLlama Site
    steps:
      - type: CheckoutStep
        name: checkout
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false

      - type: PublishSiteStep
        name: deploy www to ~site
        condition: SUCCESSFUL
        optional: false
        sourcePath: www
        artifacts: "**"

      - type: CommandStep
        name: build C kernel + install deps
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |

            echo "=== System Dependencies ==="
            apt-get update -qq && apt-get install -y -qq gcc 2>/dev/null

            echo "=== Python Dependencies ==="
            pip install flask numpy gguf regex ftfy --break-system-packages -q

            echo "=== Build C AVX2 Kernels ==="
            gcc -O3 -march=native -shared -fPIC \
              -o src/mojollama/model/libq4matmul.so \
              src/mojollama/model/q4_matmul_c.c 2>/dev/null || true
            gcc -O3 -mavx2 -mfma -mf16c -shared -fPIC \
              -o src/mojollama/kernels/q4_kernel_avx2.so \
              src/mojollama/kernels/q4_kernel_avx2.c 2>/dev/null || true
            gcc -O3 -mavx2 -mfma -mf16c -fopenmp -shared -fPIC \
              -o src/mojollama/kernels/q4_kernel_omp.so \
              src/mojollama/kernels/q4_kernel_omp.c 2>/dev/null || true

      - type: CommandStep
        name: verify model + smoke test + deploy Studio
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |

            echo "=== Python Dependencies (fresh container) ==="
            pip install flask numpy gguf regex ftfy --break-system-packages -q

            export PYTHONPATH=/onedev-build/work/src:$PYTHONPATH

            echo "=== Model Check ==="
            if [ -f Llama-3.2-1B-Instruct-Q4_0.gguf ]; then
              echo "Model file present ($(du -h Llama-3.2-1B-Instruct-Q4_0.gguf | cut -f1))"
            else
              echo "Downloading model (728 MB)..."
              curl -L -o Llama-3.2-1B-Instruct-Q4_0.gguf \
                "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_0.gguf"
            fi

            echo ""
            echo "=== Start llama-server (backend) ==="
            apt-get update -qq && apt-get install -y -qq gcc 2>/dev/null || true
            if [ -f /tmp/llama.cpp/build/bin/llama-server ]; then
              LLAMA_SERVER=/tmp/llama.cpp/build/bin/llama-server
            else
              LLAMA_SERVER="llama-server"
            fi

            echo "=== Start MojoLlama API Server (background) ==="
            cd /onedev-build/work

            nohup python3 -m mojollama.server \
              --model Llama-3.2-1B-Instruct-Q4_0.gguf \
              --port 8080 \
              --llama-port 8081 \
              > /tmp/mojollama-api.log 2>&1 &
            API_PID=$!
            echo "MojoLlama server PID=$API_PID on port 8080"

            echo ""
            echo "=== Wait for Server Ready ==="
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "Server ready after ~${i}s"
                break
              fi
              if [ $i -eq 120 ]; then
                echo "Server failed to start within 240s"
                cat /tmp/mojollama-api.log | tail -30
                kill $API_PID 2>/dev/null || true
                exit 1
              fi
              sleep 2
            done

            echo ""
            echo "=== Verify Studio UI is served ==="
            STUDIO_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/studio.html 2>/dev/null || echo "000")
            if [ "$STUDIO_CODE" = "200" ]; then
              echo "Studio UI: SERVED on port 8080 (HTTP 200)"
            else
              echo "Studio UI: HTTP $STUDIO_CODE"
            fi

            echo "www/ files present:"
            ls -la /onedev-build/work/www/

            echo ""
            echo "=========================================="
            echo "  MojoLlama Studio deployed to OneDev"
            echo "  Static UI: https://git.bamse.cloud/a730/MojoLlama/~site/"
            echo ""
            echo "  To connect Studio to a live backend:"
            echo "  1. Open the Studio site"
            echo "  2. Click the gear icon ⚙"
            echo "  3. Enter your server URL (e.g. http://hostname:8080)"
            echo "  4. The server should be: localhost:8080"
            echo ""
            echo "  Server status (from this machine):"
            curl -sf http://localhost:8080/health 2>/dev/null \
              && echo "  ✅ Server on :8080 is UP" \
              || echo "  ⚠️  Server on :8080 unreachable (expected in build container)"
            echo "=========================================="

    triggers:
      - type: BranchUpdateTrigger
        branches: main
      - type: BranchUpdateTrigger
        branches: dev

    retryCondition: never