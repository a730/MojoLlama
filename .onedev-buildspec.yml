version: 6

jobs:

  # ============================================================================
  # JOB 1: Build — Compile C kernels, build artifacts
  # ============================================================================
  - name: Build Kernels
    steps:

      - type: CheckoutStep
        name: checkout
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false

      - type: CommandStep
        name: install deps + compile C kernels
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |
            set -e
            echo "=== System Dependencies ==="
            apt-get update -qq && apt-get install -y -qq gcc 2>/dev/null

            echo "=== Python Dependencies ==="
            pip install flask numpy gguf regex ftfy --break-system-packages -q

            echo "=== Build C AVX2 Kernels (Parallel) ==="
            echo "-> q4_matmul.so"
            gcc -O3 -march=native -shared -fPIC \
              -o src/mojollama/model/libq4matmul.so \
              src/mojollama/model/q4_matmul_c.c &

            echo "-> q4_kernel_avx2.so"
            gcc -O3 -mavx2 -mfma -mf16c -shared -fPIC \
              -o src/mojollama/kernels/q4_kernel_avx2.so \
              src/mojollama/kernels/q4_kernel_avx2.c &

            echo "-> q4_kernel_omp.so (OMP)"
            gcc -O3 -mavx2 -mfma -mf16c -fopenmp -shared -fPIC \
              -o src/mojollama/kernels/q4_kernel_omp.so \
              src/mojollama/kernels/q4_kernel_omp.c &

            echo "-> cengine_batch.so (AVX2 batch)"
            gcc -O3 -mavx2 -mfma -mf16c -fopenmp -shared -fPIC \
              -o src/mojollama/kernels/cengine_batch.so \
              src/mojollama/kernels/cengine_batch.c &

            wait
            echo "All kernels compiled successfully"

            echo "=== Verify Shared Libraries ==="
            find src -name "*.so" -exec file {} \; | grep -c "ELF" || echo "No .so files found"
            ls -lh src/mojollama/kernels/*.so src/mojollama/model/*.so 2>/dev/null || true

      - type: PublishArtifactStep
        name: publish kernel artifacts
        condition: SUCCESSFUL
        optional: false
        artifacts: 'src/**/*.so'

      - type: SetBuildVersionStep
        name: set build version
        condition: SUCCESSFUL
        optional: false
        buildVersion: '@commit_hash@'

    triggers:
      - type: BranchUpdateTrigger
        branches: main dev

    retryCondition: never


  # ============================================================================
  # JOB 2: Deploy — Publish static site + smoke test
  # ============================================================================
  - name: Deploy Site
    jobDependencies:
      - jobName: Build Kernels
        requireSuccessful: true
    steps:

      - type: CheckoutStep
        name: checkout
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false

      - type: PublishSiteStep
        name: deploy www to ~site
        condition: SUCCESSFUL
        optional: false
        sourcePath: www
        artifacts: "**"

      - type: CommandStep
        name: install deps + smoke test
        condition: SUCCESSFUL
        optional: true
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |
            set -e
            echo "=== Python Dependencies ==="
            pip install flask numpy gguf regex ftfy --break-system-packages -q

            export PYTHONPATH=/onedev-build/work/src:$PYTHONPATH

            echo "=== Verify Python imports ==="
            python3 -c "import sys; sys.path.insert(0,'src'); from mojollama.server import app; print('OK')" 2>&1 || echo "import check non-fatal"

            echo "=== Verify Site Files ==="
            if [ -f www/index.html ]; then
              echo "index.html: $(wc -c < www/index.html) bytes"
              echo "Studio UI: $([ -f www/studio.html ] && echo 'PRESENT' || echo 'MISSING')"
              echo "Chat UI: $([ -f www/chat.html ] && echo 'PRESENT' || echo 'MISSING')"
            fi

            echo ""
            echo "========================================"
            echo "  MojoLlama Site Deployed"
            echo "  URL: https://git.bamse.cloud/a730/MojoLlama/~site/"
            echo "  Studio: ~/studio.html"
            echo "  Chat:   ~/chat.html"
            echo "========================================"

    triggers:
      - type: BranchUpdateTrigger
        branches: main

    retryCondition: never


  # ============================================================================
  # JOB 3: Quick Test (dev-only) — Fast CI for feature branches
  # ============================================================================
  - name: Quick Test
    steps:

      - type: CheckoutStep
        name: checkout
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false

      - type: CommandStep
        name: lint HTML + validate site
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: python:3.11
        interpreter:
          type: DefaultInterpreter
          commands: |
            set -e
            echo "=== Validate HTML Files ==="
            for f in www/index.html www/studio.html www/chat.html; do
              if [ -f "$f" ]; then
                LINES=$(wc -l < "$f")
                echo "OK $f ($LINES lines)"
              else
                echo "MISSING $f"
              fi
            done

            echo "=== Check Required Tags ==="
            for f in www/index.html www/studio.html www/chat.html; do
              if [ -f "$f" ]; then
                HAS_TITLE=$(grep -c '<title>' "$f" || true)
                HAS_DOCTYPE=$(grep -c '<!DOCTYPE html>' "$f" || true)
                echo "  $f: DOCTYPE=$HAS_DOCTYPE TITLE=$HAS_TITLE"
              fi
            done

            echo "HTML validation complete"

    triggers:
      - type: BranchUpdateTrigger
        branches: dev

    retryCondition: never

  # ────────────────────────────────────────────────────────────────────────
  # Docker image build — runs on main branch pushes
  # ────────────────────────────────────────────────────────────────────────
  - name: Build Docker Image
    steps:
      - type: CheckoutStep
        name: checkout
        cloneCredential:
          type: DefaultCredential
        withLfs: false
        withSubmodules: false
        cloneDepth: 1
        condition: SUCCESSFUL
        optional: false

      - type: CommandStep
        name: build mojollama Docker image
        condition: SUCCESSFUL
        optional: false
        runInContainer: true
        image: docker:27
        interpreter:
          type: DefaultInterpreter
          commands: |

            echo "=== Build Docker Image ==="
            docker build \
              --file Dockerfile \
              --tag mojollama:latest \
              --tag mojollama:$(date -u +%Y%m%d-%H%M%S) \
              .

            echo ""
            echo "=== Image Info ==="
            docker images mojollama

            echo ""
            echo "=== Verify Image (syntax check) ==="
            docker run --rm mojollama:latest --help 2>&1 || true

    triggers:
      - type: BranchUpdateTrigger
        branches: main

    retryCondition: never
