<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoLlama Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b12; --bg2: #0c101a; --surface: #111624; --surface2: #171d2e;
  --border: #252d4a; --text: #e2e8f0; --dim: #7f8ea3; --dim2: #5a6a82;
  --mojo: #6C3CE1; --mojo-light: #8B5CF6; --cyan: #22D3EE;
  --green: #34D399; --red: #F87171;
  --glass: rgba(17,22,36,0.88);
  --grad-mojo: linear-gradient(135deg, #6C3CE1, #8B5CF6, #22D3EE);
  --radius: 12px; --radius-sm: 8px;
  --font-heading: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); height: 100vh; display: flex; flex-direction: column;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); }

/* Header */
header {
  background: var(--glass); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
header .logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-heading); font-size: 18px; font-weight: 800;
}
header .logo .logo-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--grad-mojo); display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
header .logo span {
  background: var(--grad-mojo); background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
header .subtitle { font-size: 12px; color: var(--dim); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 7px 12px; border-radius: var(--radius-sm); font-size: 13px; min-width: 180px;
  font-family: var(--font-body);
}
select:focus { outline: none; border-color: var(--mojo-light); }
.backend-badge {
  font-size: 12px; padding: 5px 12px; border-radius: 16px;
  border: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
  background: var(--surface);
}
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.offline { background: var(--red); }
.chat-area { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; padding: 0 20px; }
.messages { flex: 1; overflow-y: auto; padding: 24px 0; scroll-behavior: smooth; }
.msg { margin-bottom: 24px; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  font-family: var(--font-heading);
}
.avatar.user { background: rgba(108,60,225,0.15); color: var(--mojo-light); }
.avatar.assistant { background: rgba(34,211,238,0.12); color: var(--cyan); }
.avatar.system { background: rgba(251,146,60,0.15); color: var(--orange); }
.name { font-size: 13px; font-weight: 600; }
.name.user { color: var(--mojo-light); }
.name.assistant { color: var(--cyan); }
.name.system { color: var(--orange); }
.time { font-size: 11px; color: var(--dim); margin-left: auto; }
.text { margin-left: 40px; font-size: 15px; line-height: 1.7; }
.text pre {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px; font-family: var(--font-mono);
  font-size: 13px; overflow-x: auto; margin: 12px 0;
}
.text code {
  background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 14px;
}
.text pre code { background: none; padding: 0; }
.typing { display: flex; gap: 6px; padding: 12px 0; margin-left: 40px; }
.typing span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--dim);
  animation: bounce 1.4s infinite ease;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
.input-area { display: flex; gap: 8px; padding: 16px 0; border-top: 1px solid var(--border); flex-shrink: 0; }
.input-area input {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text); font-size: 14px;
  font-family: var(--font-body);
}
.input-area input:focus { outline: none; border-color: var(--mojo-light); }
.input-area input::placeholder { color: var(--dim); }
.btn {
  padding: 10px 24px; border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; transition: all .2s; font-family: var(--font-body);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--grad-mojo); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
.btn-dim {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
}
.btn-dim:hover:not(:disabled) { border-color: var(--mojo-light); color: var(--mojo-light); }
.shortcuts { display: flex; gap: 6px; padding: 12px 0; flex-wrap: wrap; align-items: center; }
.shortcut {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 16px;
  font-size: 12px; color: var(--dim); cursor: pointer; transition: all .2s;
  background: transparent; font-family: var(--font-body);
}
.shortcut:hover { border-color: var(--mojo-light); color: var(--mojo-light); }
.status-bar {
  display: flex; align-items: center; gap: 16px; padding: 10px 0; font-size: 12px;
  color: var(--dim); border-top: 1px solid var(--border2); flex-shrink: 0;
}
.chat-controls { display: flex; gap: 4px; align-items: center; }
@media (max-width: 600px) {
  .chat-area { padding: 0 12px; }
  .text { margin-left: 0; }
  header { padding: 10px 16px; }
  select { min-width: 120px; font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <a href="index.html" style="text-decoration:none;color:inherit">
    <div class="logo">
      <div class="logo-icon">🦙</div>
      <span>MojoLlama</span>
    </div>
  </a>
  <span class="subtitle">Chat Playground</span>
  <div class="header-right">
    <select id="modelSelect"><option value="">Select model...</option></select>
    <span class="backend-badge">
      <span class="dot offline" id="statusDot"></span>
      <span id="backendLabel">offline</span>
    </span>
  </div>
</header>
<div class="chat-area">
  <div class="shortcuts">
    <span style="font-size:11px;color:var(--dim2)">Quick:</span>
    <button class="shortcut" onclick="quickPrompt('Explain quantum computing in simple terms')">Quantum computing</button>
    <button class="shortcut" onclick="quickPrompt('Write a Python function to sort a list')">Write code</button>
    <button class="shortcut" onclick="quickPrompt('What is the meaning of life?')">Philosophy</button>
    <button class="shortcut" onclick="quickPrompt('Summarize the history of AI')">History of AI</button>
  </div>
  <div class="messages" id="messages">
    <div class="msg">
      <div class="msg-header">
        <div class="avatar assistant">M</div>
        <span class="name assistant">MojoLlama</span>
        <span class="time">ready</span>
      </div>
      <div class="text">Hello! I'm <strong>MojoLlama</strong>. Select a model above and start chatting.<br>Responses stream in <strong>real-time</strong> token by token.</div>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="chatInput" placeholder="Type a message..." autofocus>
    <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">Send</button>
    <button class="btn btn-dim" onclick="clearChat()">Clear</button>
  </div>
  <div class="status-bar">
    <span id="modelStatus">No model selected</span>
    <span style="margin-left:auto">⚡ Streaming</span>
    <span style="color:var(--green);font-weight:600">ON</span>
  </div>
</div>

<script>
const API = (() => {
  const params = new URLSearchParams(location.search);
  const apiParam = params.get('api');
  if (apiParam) return apiParam;
  if (location.port === '9000') return '';
  return `http://${location.hostname}:9000`;
})();
let msgCount = 0;
const history = [];

async function init() {
  const resp = await fetch(`${API}/api/models`);
  if (!resp.ok) return;
  const data = await resp.json();
  const sel = document.getElementById('modelSelect');
  sel.innerHTML = '<option value="">Select model...</option>';
  (data.models || []).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.path || m.name;
    opt.textContent = `${m.name} (${(m.size_gb || 0).toFixed(1)} GB)`;
    sel.appendChild(opt);
  });
  try {
    const b = await fetch(`${API}/api/backend`).then(r => r.json());
    document.getElementById('statusDot').className = 'dot online';
    document.getElementById('backendLabel').textContent = b.active || b.backend || 'online';
    document.getElementById('backendLabel').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('statusDot').className = 'dot offline';
    document.getElementById('backendLabel').textContent = 'offline';
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  const model = document.getElementById('modelSelect').value;
  if (!model) { showError('Select a model first'); return; }
  input.value = '';
  msgCount++;
  history.push({role: 'user', content: msg});
  const container = document.getElementById('messages');
  addMessage('user', 'You', msg);
  container.scrollTop = container.scrollHeight;
  const typingId = 'typing-' + Date.now();
  container.innerHTML += `<div class="typing" id="${typingId}"><span></span><span></span><span></span></div>`;
  container.scrollTop = container.scrollHeight;
  const msgId = 'msg-' + Date.now();
  container.innerHTML += `<div class="msg" id="${msgId}" style="display:none">
    <div class="msg-header">
      <div class="avatar assistant">M</div>
      <span class="name assistant">MojoLlama</span>
      <span class="time" id="${msgId}-time">streaming</span>
    </div>
    <div class="text" id="${msgId}-text"></div>
  </div>`;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '⏳';
  let fullText = '';
  try {
    const resp = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model, messages: history, prompt: msg, max_tokens: 512, stream: true})
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();
    document.getElementById(msgId).style.display = '';
    const textEl = document.getElementById(`${msgId}-text`);
    const timeEl = document.getElementById(`${msgId}-time`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const chunk = line.slice(6).trim();
          if (chunk === '[DONE]') continue;
          try {
            const parsed = JSON.parse(chunk);
            const content = parsed.choices?.[0]?.delta?.content || parsed.content || '';
            if (content) {
              fullText += content;
              textEl.innerHTML = renderMarkdown(fullText);
              container.scrollTop = container.scrollHeight;
            }
          } catch(e) {}
        }
      }
    }
    timeEl.textContent = `${fullText.split(' ').length} words`;
    history.push({role: 'assistant', content: fullText});
  } catch(e) {
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();
    document.getElementById(msgId).style.display = '';
    document.getElementById(`${msgId}-text`).innerHTML = `<span style="color:var(--red)">⚠ Error: ${escapeHtml(e.message)}</span>`;
  }
  btn.disabled = false;
  btn.textContent = 'Send';
  updateStatus();
}

function addMessage(role, name, content) {
  const container = document.getElementById('messages');
  const time = new Date().toLocaleTimeString();
  container.innerHTML += `<div class="msg">
    <div class="msg-header">
      <div class="avatar ${role}">${role === 'user' ? 'U' : role === 'system' ? 'S' : 'M'}</div>
      <span class="name ${role}">${name}</span>
      <span class="time">${time}</span>
    </div>
    <div class="text">${renderMarkdown(escapeHtml(content))}</div>
  </div>`;
  container.scrollTop = container.scrollHeight;
}

function showError(msg) {
  addMessage('system', 'System', `⚠ ${msg}`);
}

function clearChat() {
  document.getElementById('messages').innerHTML = `
    <div class="msg">
      <div class="msg-header">
        <div class="avatar assistant">M</div>
        <span class="name assistant">MojoLlama</span>
        <span class="time">cleared</span>
      </div>
      <div class="text">Chat cleared. Select a model and start chatting.</div>
    </div>`;
  history.length = 0;
  msgCount = 0;
  updateStatus();
}

function quickPrompt(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function updateStatus() {
  const model = document.getElementById('modelSelect').value;
  document.getElementById('modelStatus').textContent = model ? `Model: ${model.split('/').pop()}` : 'No model selected';
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('modelSelect').addEventListener('change', updateStatus);

function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

init();
setInterval(async () => {
  try {
    const b = await fetch(`${API}/api/backend`).then(r => r.json());
    document.getElementById('statusDot').className = 'dot online';
    document.getElementById('backendLabel').textContent = b.active || 'online';
    document.getElementById('backendLabel').style.color = 'var(--green)';
  } catch(e) {}
}, 15000);
</script>
</body>
</html>
