<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoLlama Chat</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --border: #30363d; --card: #161b22; --muted: #8b949e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 720px; margin: 12px auto; padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
  .user { background: var(--card); border: 1px solid var(--border); margin-left: 40px; }
  .assistant { background: #1c2333; border: 1px solid var(--border); margin-right: 40px; }
  .assistant .name { color: var(--accent); font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
  #input-area { border-top: 1px solid var(--border); padding: 16px; display: flex; gap: 8px; max-width: 760px; margin: 0 auto; width: 100%; }
  #input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--fg); font-size: 1rem; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; cursor: pointer; }
  #send:hover { opacity: 0.9; }
  .info { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 20px; }
  .loading { text-align: center; color: var(--muted); padding: 8px; }
</style>
</head>
<body>
<div id="messages">
  <div class="info">MojoLlama Chat — connect to a running server to start</div>
</div>
<div id="input-area">
  <input id="input" type="text" placeholder="Type a message..." autofocus>
  <button id="send" onclick="send()">Send</button>
</div>
<script>
const API = window.location.origin + '/v1/chat/completions';
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
let history = [];

function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  if (role === 'assistant') { const n = document.createElement('div'); n.className = 'name'; n.textContent = 'MojoLlama'; d.appendChild(n); }
  const t = document.createElement('div'); t.textContent = text; d.appendChild(t);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}

async function send() {
  const text = input.value.trim(); if (!text) return;
  input.value = ''; addMsg('user', text);
  history.push({role:'user', content:text});
  const load = document.createElement('div'); load.className = 'loading'; load.textContent = 'Thinking...'; msgs.appendChild(load);
  try {
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'default', messages:history, stream:false})});
    const j = await r.json();
    const reply = j.choices?.[0]?.message?.content || JSON.stringify(j);
    load.remove(); addMsg('assistant', reply);
    history.push({role:'assistant', content:reply});
  } catch(e) { load.remove(); addMsg('assistant', 'Error: ' + e.message); }
}
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
