<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoLlama Chat</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --border: #30363d; --card: #161b22; --muted: #8b949e; --mojo: #6C3CE1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  #connection-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; background: var(--card);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #connection-bar label { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  #server-url {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--fg); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; outline: none;
  }
  #server-url:focus { border-color: var(--accent); }
  #connect-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  #connect-btn:hover { opacity: 0.9; }
  #status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.75rem; color: var(--muted); white-space: nowrap;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.offline { background: #f85149; }
  .dot.online { background: #3fb950; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 720px; margin: 12px auto; padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
  .user { background: var(--card); border: 1px solid var(--border); margin-left: 40px; }
  .assistant { background: #1c2333; border: 1px solid var(--border); margin-right: 40px; }
  .assistant .name { color: var(--accent); font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
  #input-area { border-top: 1px solid var(--border); padding: 16px; display: flex; gap: 8px; max-width: 760px; margin: 0 auto; width: 100%; }
  #input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--fg); font-size: 1rem; outline: none; }
  #input:focus { border-color: var(--accent); }
  #input:disabled { opacity: 0.4; }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; cursor: pointer; }
  #send:hover { opacity: 0.9; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  .info { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 20px; }
  .loading { text-align: center; color: var(--muted); padding: 8px; }
</style>
</head>
<body>
<div id="connection-bar">
  <label>Server</label>
  <input id="server-url" type="text" value="http://localhost:8080" placeholder="http://localhost:8080">
  <button id="connect-btn" onclick="connect()">Connect</button>
  <span id="status"><span class="dot offline"></span> Disconnected</span>
</div>
<div id="messages">
  <div class="info">Enter a server URL above and click Connect, then start chatting.</div>
</div>
<div id="input-area">
  <input id="input" type="text" placeholder="Type a message..." autofocus disabled>
  <button id="send" onclick="send()" disabled>Send</button>
</div>
<script>
let API = '';
let history = [];
let connected = false;
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  if (role === 'assistant') {
    const n = document.createElement('div'); n.className = 'name'; n.textContent = 'MojoLlama'; d.appendChild(n);
  }
  const t = document.createElement('div'); t.textContent = text; d.appendChild(t);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}

function setConnected(on) {
  connected = on;
  statusEl.innerHTML = on
    ? '<span class="dot online"></span> Connected'
    : '<span class="dot offline"></span> Disconnected';
  input.disabled = !on;
  sendBtn.disabled = !on;
  if (on) input.focus();
}

async function connect() {
  const url = document.getElementById('server-url').value.trim().replace(/\/+$/, '');
  if (!url) return;
  API = url + '/v1/chat/completions';
  const statusDot = statusEl.querySelector('.dot');
  statusEl.innerHTML = '<span class="dot offline"></span> Connecting...';
  try {
    const r = await fetch(url + '/v1/models', { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setConnected(true);
    msgs.innerHTML = '<div class="info">Connected to ' + url + '</div>';
  } catch(e) {
    setConnected(false);
    msgs.innerHTML = '<div class="info">❌ Connection failed: ' + e.message + '. Check that the server is running and the URL is correct.</div>';
  }
}

async function send() {
  const text = input.value.trim(); if (!text || !connected) return;
  input.value = ''; addMsg('user', text);
  history.push({role:'user', content:text});
  const load = document.createElement('div'); load.className = 'loading'; load.textContent = 'Thinking...'; msgs.appendChild(load);
  try {
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'default', messages:history, stream:false})
    });
    const j = await r.json();
    const reply = j.choices?.[0]?.message?.content || JSON.stringify(j);
    load.remove(); addMsg('assistant', reply);
    history.push({role:'assistant', content:reply});
  } catch(e) {
    load.remove();
    if (e.name === 'TypeError' || e.message.includes('Failed to fetch')) {
      setConnected(false);
      addMsg('assistant', '❌ Connection lost. Reconnect to the server.');
    } else {
      addMsg('assistant', 'Error: ' + e.message);
    }
  }
}

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) send(); });
window.addEventListener('load', () => { document.getElementById('server-url').select(); });
</script>
</body>
</html>
