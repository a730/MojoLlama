<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MojoLlama Chat — Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #f0f6fc; }
  header .back { color: #58a6ff; text-decoration: none; font-size: 13px; }
  header .back:hover { text-decoration: underline; }
  .model-badge {
    background: #1f6feb22;
    border: 1px solid #1f6feb44;
    color: #58a6ff;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
  }
  #conn-status {
    margin-left: auto;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #conn-status .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  #conn-status.online .dot { background: #3fb950; }
  #conn-status.offline .dot { background: #f85149; }
  #conn-status.online { color: #3fb950; }
  #conn-status.offline { color: #f85149; }
  .server-bar {
    display: flex;
    gap: 8px;
    padding: 8px 20px;
    background: #0d1117;
    border-bottom: 1px solid #21262d;
    align-items: center;
    flex-shrink: 0;
  }
  .server-bar label { font-size: 12px; color: #8b949e; white-space: nowrap; }
  .server-bar input {
    flex: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'SF Mono', Monaco, monospace;
    outline: none;
    max-width: 400px;
  }
  .server-bar input:focus { border-color: #1f6feb; }
  .server-bar button {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .server-bar button:hover { background: #30363d; }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.5;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .msg.user { align-self: flex-end; background: #1f6feb; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
  .msg.system { align-self: center; background: #1c2128; border: 1px solid #30363d; color: #8b949e; font-style: italic; font-size: 12px; }
  .msg .meta { font-size: 11px; color: #8b949e; margin-top: 4px; }
  #input-area {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #input-area textarea {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    padding: 10px 12px;
    font-size: 14px;
    resize: none;
    min-height: 44px;
    font-family: inherit;
    outline: none;
  }
  #input-area textarea:focus { border-color: #1f6feb; }
  #input-area button {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #input-area button:hover { background: #2ea043; }
  #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .typing { color: #8b949e; font-size: 13px; padding: 8px 16px; align-self: flex-start; display: flex; align-items: center; gap: 8px; }
  @media (max-width: 640px) { .msg { max-width: 90%; } }
</style>
</head>
<body>

<header>
  <a class="back" href="/">← MojoLlama</a>
  <h1>💬 Playground</h1>
  <span class="model-badge" id="model-name">—</span>
  <span id="conn-status" class="offline"><span class="dot"></span> Disconnected</span>
</header>

<div class="server-bar">
  <label>Server:</label>
  <input id="server-url" type="text" value="http://localhost:8080" spellcheck="false">
  <button onclick="connect()">Connect</button>
  <button onclick="clearChat()" style="color:#8b949e;">Clear</button>
</div>

<div id="chat-messages">
  <div class="msg system">Enter a server URL and click <strong>Connect</strong> to start.</div>
</div>

<div id="input-area">
  <textarea id="chat-input" placeholder="Type a message..." rows="1"
    onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}" disabled></textarea>
  <button id="send-btn" onclick="sendChat()" disabled>Send</button>
</div>

<script>
let API_BASE = 'http://localhost:8080';
let messages = [{role: 'system', content: 'You are a helpful AI assistant.'}];
let generating = false;
let modelName = '—';

function getBase() {
  return document.getElementById('server-url').value.replace(/\/+$/, '');
}

async function connect() {
  const url = getBase();
  const status = document.getElementById('conn-status');
  status.className = 'offline';
  status.innerHTML = '<span class="dot"></span> Connecting...';

  try {
    const r = await fetch(url + '/v1/models', { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    modelName = data.data?.[0]?.id || 'unknown';
    API_BASE = url;
    document.getElementById('model-name').textContent = modelName;
    status.className = 'online';
    status.innerHTML = '<span class="dot"></span> Connected';
    document.getElementById('chat-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    addSystemMsg('Connected to <strong>' + url + '</strong> — Model: ' + modelName);
  } catch(e) {
    status.className = 'offline';
    status.innerHTML = '<span class="dot"></span> Connection failed';
    document.getElementById('chat-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
    addSystemMsg('Could not connect: ' + e.message);
  }
}

function addMsg(role, content) {
  const container = document.getElementById('chat-messages');
  const placeholder = container.querySelector('.msg.system');
  if (placeholder && placeholder.textContent.includes('Enter a server URL')) placeholder.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addSystemMsg(text) {
  return addMsg('system', text);
}

function showTyping() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span class="spinner"></span> Thinking...';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendChat() {
  if (generating) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  generating = true;
  document.getElementById('send-btn').disabled = true;

  messages.push({role: 'user', content: text});
  addMsg('user', escapeHTML(text));
  showTyping();

  try {
    const r = await fetch(API_BASE + '/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages, max_tokens: 256, temperature: 0.7})
    });
    hideTyping();
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const reply = data.choices?.[0]?.message?.content || '[empty response]';
    messages.push({role: 'assistant', content: reply});
    addMsg('assistant', escapeHTML(reply));
    if (data.usage) {
      document.getElementById('model-name').textContent =
        modelName + ' | ' + data.usage.total_tokens + ' tok';
    }
  } catch(e) {
    hideTyping();
    addSystemMsg('Error: ' + escapeHTML(e.message));
  }

  generating = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function clearChat() {
  messages = [{role: 'system', content: 'You are a helpful AI assistant.'}];
  document.getElementById('chat-messages').innerHTML = '';
}

// Auto-connect on load if server URL in query params
const params = new URLSearchParams(window.location.search);
if (params.get('server')) {
  document.getElementById('server-url').value = params.get('server');
}
setTimeout(connect, 800);
</script>
</body>
</html>
